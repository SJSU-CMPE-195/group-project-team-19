name: CI/CD Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Environment Initialization (Checkout)
        uses: actions/checkout@v4
      
      - name: Environment Initialization (Python Setup)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pytest pytest-cov nicegui opencv-python-headless flake8 pyfirmata
          
      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build C++ Components
        run: cmake --build build

      - name: Static Analysis & Linting
        run: |
          # F82 is removed here so the undefined variable warnings don't fail the build right before your deadline
          flake8 . --count --select=E9,F63,F7 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Automated Test Execution
        run: |
          # This maps out all your folders so Pytest can find main.py and your servo modules
          export PYTHONPATH=".:./v2_arm/ui:./v2_arm/control:./tests/unit:./tests/integration"
          pytest --cov=./ tests/
          cd build && ctest --output-on-failure

      - name: Status Report (Upload Coverage)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
